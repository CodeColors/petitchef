version: "2"

linters:
  enable:
    - bodyclose
    - errname
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # commentaires en français, pas de format imposé
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Mots de passe et requêtes construites dans les tests : données factices.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
