# PetitChef sur Synology (Container Manager > Projet). Voir README.md.
services:
  petitchef:
    image: ghcr.io/codecolors/petitchef:latest
    container_name: petitchef
    restart: unless-stopped
    # UID:GID du propriétaire du dossier de données sur le NAS.
    user: "1026:100"
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
      # Adresse publique derrière le reverse proxy DSM (active les cookies Secure) :
      # BASE_URL: https://cuisine.mondomaine.fr
      # Réseau Docker du reverse proxy, pour connaître l'IP réelle des clients :
      # TRUSTED_PROXIES: 172.16.0.0/12
      # Chiffre les sauvegardes (12 caractères au moins ; à conserver hors du NAS) :
      # BACKUP_PASSPHRASE: une phrase de passe longue et unique
    volumes:
      - /volume1/docker/petitchef:/data
      # Second emplacement pour la copie des sauvegardes (facultatif) :
      # - /volumeUSB1/usbshare/petitchef:/copie
    mem_limit: 128m
    cpus: 0.5
