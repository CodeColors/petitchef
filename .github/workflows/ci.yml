name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Vet, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test -race ./...

  e2e:
    name: Interface (Playwright)
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: make build
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-ecran
          path: e2e/screenshots/
          if-no-files-found: ignore

  image:
    name: Image Docker amd64 + arm64
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Construction amd64 (contrôles)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: petitchef:ci
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Taille, démarrage et mémoire au repos
        run: |
          size=$(docker image inspect -f '{{.Size}}' petitchef:ci)
          docker run -d --name pc --memory 128m --cpus 0.5 -e TZ=Europe/Paris petitchef:ci
          for i in $(seq 1 30); do docker exec pc /petitchef healthcheck && break; sleep 0.2; done
          docker exec pc /petitchef healthcheck
          sleep 10
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' pc)
          bytes=$(echo "$mem" | awk '{v=$1; u=v; gsub(/[0-9.]/,"",u); gsub(/[A-Za-z]/,"",v); m=(u=="GiB")?1073741824:(u=="MiB")?1048576:(u=="KiB")?1024:1; printf "%d", v*m}')
          logs=$(docker logs pc 2>&1)
          echo "$logs"
          docker rm -f pc
          {
            echo "### Mesures de l'image (linux/amd64)"
            echo "| Mesure | Valeur | Cible |"
            echo "|---|---|---|"
            echo "| Taille | $((size / 1024 / 1024)) Mio | < 50 Mo |"
            echo "| Mémoire au repos | ${mem%% /*} | < 64 Mo |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 50000000 || { echo "::error::image trop lourde : $size octets"; exit 1; }
          test "$bytes" -lt 67108864 || { echo "::error::mémoire au repos trop élevée : $mem"; exit 1; }
          grep -q 'fuseau=Europe/Paris' <<<"$logs" || { echo "::error::fuseau TZ non appliqué"; exit 1; }

      # L'image arm64 (NAS ARM) démarre et répond, sous émulation.
      - uses: docker/setup-qemu-action@v4
      - name: Construction arm64 (contrôles)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: petitchef:ci-arm64
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
      - name: Démarrage arm64
        run: |
          docker run -d --name pc-arm --platform linux/arm64 petitchef:ci-arm64
          for i in $(seq 1 50); do docker exec pc-arm /petitchef healthcheck && break; sleep 0.5; done
          docker exec pc-arm /petitchef healthcheck
          docker logs pc-arm
          docker rm -f pc-arm
          echo "Démarrage de l'image linux/arm64 (émulée) : OK" >> "$GITHUB_STEP_SUMMARY"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construction multi-architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
